# dsh-win-notify —— bundle patch
#
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把本插件插入 Web profile 的配置树。
# 安装：dsh plugin --profile desktop add "link:<本目录绝对路径>"
#      并把 "dsh-win-notify" 追加到 profile package.json 的 dsh.profile.bundles。
#
# 需要改配置时，在 profile 的 cordis.patch.yml 里按 id 覆盖（同 id 后写覆盖前写）：
#   - id: dsh-win-notify
#     name: dsh-win-notify
#     config:
#       sound: false
#       approvalTitle: "DSH · 需要审批"
- insert:
    - id: dsh-win-notify
      name: dsh-win-notify
